{% extends "base.html" %}
{% set active_page='customers' %}
{% block title %}Edit guest{% endblock %}
{% block content %}
<div class="page-heading">
  <div><p class="eyebrow">OPERATIONS / GUESTS</p><h1 class="page-title"><span class="room-icon-chip" style="display:inline-flex;justify-content:center;width:2.1rem;height:2.1rem;font-size:1.1rem;margin-right:.55rem;vertical-align:-.55em;background:rgba(212,192,138,.32);color:#8A6A14;"><i class="ph ph-user-gear"></i></span>Edit guest</h1><p class="page-subtitle">Update the guest profile without changing invoice history.</p></div>
  <a class="btn-secondary" href="/customers"><i class="ph ph-arrow-left" style="font-size:.95rem;"></i>Guest directory</a>
</div>
<section class="panel max-w-3xl">
  <form method="post" action="/customers/{{ guest.id }}/edit" class="grid gap-x-4 gap-y-5 sm:grid-cols-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="text-sm font-medium"><span class="field-label"><i class="ph ph-user"></i>Name</span><input class="form-input" name="name" value="{{ guest.name }}" maxlength="160" required></label>
    <label class="text-sm font-medium"><span class="field-label"><i class="ph ph-phone"></i>Phone</span><input class="form-input" name="phone" value="{{ guest.phone }}" maxlength="40"></label>
    <label class="text-sm font-medium"><span class="field-label"><i class="ph ph-envelope-simple"></i>Email</span><input class="form-input" name="email" type="email" value="{{ guest.email }}" maxlength="180"></label>
    <label class="text-sm font-medium"><span class="field-label"><i class="ph ph-map-pin"></i>Address</span><input class="form-input" name="address" value="{{ guest.address }}" maxlength="240"></label>
    <label class="text-sm font-medium"><span class="field-label"><i class="ph ph-identification-card"></i>PAN / VAT number</span><input class="form-input" name="pan_vat_number" value="{{ guest.pan_vat_number }}" maxlength="80"></label>
    <label class="text-sm font-medium"><span class="field-label"><i class="ph ph-users"></i>Guest type</span><select class="form-input" name="customer_type"><option value="individual" {% if guest.customer_type == 'individual' %}selected{% endif %}>Individual</option><option value="business" {% if guest.customer_type == 'business' %}selected{% endif %}>Business</option></select></label>
    <label class="text-sm font-medium"><span class="field-label"><i class="ph ph-identification-badge"></i>ID type</span><input class="form-input" name="id_type" value="{{ guest.id_type }}" maxlength="40"></label>
    <label class="text-sm font-medium"><span class="field-label"><i class="ph ph-hash"></i>ID number</span><input class="form-input" name="id_number" value="{{ guest.id_number }}" maxlength="100"></label>
    <div class="flex gap-2 sm:col-span-2"><button class="btn-primary"><i class="ph ph-floppy-disk"></i>Save guest</button><a class="btn-secondary" href="/customers"><i class="ph ph-x"></i>Cancel</a></div>
  </form>
</section>
{% endblock %}
