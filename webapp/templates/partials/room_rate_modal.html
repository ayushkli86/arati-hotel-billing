<div class="fixed inset-0 z-50 grid place-items-center bg-slate-950/45 p-4" @click.self="$el.remove()">
  <section role="dialog" aria-modal="true" class="w-full max-w-sm rounded-2xl bg-white p-5 shadow-2xl">
    <p class="eyebrow">ROOM {{ room.number }}</p><h2 class="mt-1 text-xl font-bold text-slate-900">Update nightly rate</h2>
    {% if error %}<div role="alert" class="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-semibold text-red-700">{{ error }}</div>{% endif %}
    <form hx-post="/rooms/{{ room.id }}/rate" hx-target="#modal-root" hx-swap="innerHTML" class="mt-4 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="block"><span class="field-label">Rate (NPR)</span><input required type="number" min="0" step=".01" name="nightly_rate" value="{{ rate_val if rate_val is defined else room.nightly_rate }}" class="form-input"></label>
      {% if room.room_type_item %}<label class="flex items-start gap-2 rounded-lg bg-slate-50 p-3 text-xs text-slate-700"><input type="checkbox" name="use_type_rate" value="1" {% if use_type_rate_val is defined %}{% if use_type_rate_val %}checked{% endif %}{% elif not room.nightly_rate_override %}checked{% endif %} class="mt-0.5 h-4 w-4 accent-teal-700"><span>Use {{ room.room_type_item.name }} type rate ({{ money(room.room_type_item.rate) }} / night) and follow future type rate changes.</span></label>{% endif %}
      <div class="flex justify-end gap-2"><button type="button" class="btn-secondary" @click="$el.closest('[role=dialog]').parentElement.remove()">Cancel</button><button class="btn-primary">Save rate</button></div>
    </form>
  </section>
</div>
