<div class="fixed inset-0 z-50 grid place-items-center bg-slate-950/45 p-4" @click.self="$el.remove()">
  <section role="dialog" aria-modal="true" class="w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl">
    <p class="eyebrow">ROOM {{ room.number }}</p>
    <h2 class="mt-1 text-xl font-bold text-slate-900">Extend stay</h2>
    <p class="mt-2 text-sm text-slate-600">{{ stay.guest_name or (stay.guest.name if stay.guest else 'Guest') }} · Current check-out {{ local_datetime(stay.expected_checkout or stay.check_out, '%d %b %Y · %H:%M') }}</p>
    {% if error %}<div role="alert" class="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-semibold text-red-700">{{ error }}</div>{% endif %}
    <form hx-post="/rooms/{{ room.id }}/extend" hx-target="#modal-root" hx-swap="innerHTML" class="mt-4 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block"><span class="field-label">New expected check-out</span><input required type="datetime-local" name="check_out" value="{{ checkout_local }}" class="form-input"></label>
      <div class="flex justify-end gap-2"><button type="button" class="btn-secondary" @click="$el.closest('[role=dialog]').parentElement.remove()">Cancel</button><button class="btn-primary">Save extension</button></div>
    </form>
  </section>
</div>
