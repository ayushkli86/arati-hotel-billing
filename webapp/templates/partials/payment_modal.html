<div x-data="{open:true}" x-show="open" x-transition.opacity class="fixed inset-0 z-50 grid place-items-center bg-slate-950/50 p-4" @keydown.escape.window="open=false" @click.self="open=false">
  <section class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl">
    <div class="flex items-start justify-between"><div><p class="text-xs font-bold uppercase tracking-widest text-red-600">Outstanding invoice</p><h2 class="mt-2 text-xl font-bold">Collect payment</h2></div><button class="rounded-lg px-2 py-1 text-xl text-slate-400 hover:bg-slate-100" @click="open=false" aria-label="Close">×</button></div>
    {% if error %}<div class="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-semibold text-red-700">{{ error }}</div>{% endif %}
    <div class="mt-5 rounded-xl bg-slate-50 p-4"><div class="flex justify-between gap-3 text-sm"><span class="text-slate-500">Invoice</span><strong>{{ invoice.invoice_number }}</strong></div><div class="mt-2 flex justify-between gap-3 text-sm"><span class="text-slate-500">Guest</span><strong>{{ invoice.guest.name }}</strong></div><div class="mt-4 flex justify-between gap-3 border-t border-slate-200 pt-3"><span class="text-sm text-slate-500">Balance due</span><strong class="text-xl text-red-600">{{ money(invoice.balance) }}</strong></div></div>
    <form class="mt-5 space-y-4" hx-post="/invoices/{{ invoice.id }}/collect" hx-target="#modal-root" hx-swap="innerHTML"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="block"><span class="mb-1.5 block text-sm font-medium">Amount (NPR)</span><input class="form-input" type="number" name="amount" min="0.01" max="{{ invoice.balance }}" step="0.01" value="{{ amount_val|default('%.2f'|format(invoice.balance)) }}" required></label><label class="block"><span class="mb-1.5 block text-sm font-medium">Payment method</span><select class="form-input" name="method">{% for method in methods %}<option {% if method_val|default(methods[0]) == method %}selected{% endif %}>{{ method }}</option>{% endfor %}</select></label><div class="flex justify-end gap-2 pt-1"><button type="button" class="btn-secondary" @click="open=false">Cancel</button><button class="btn-danger">Record payment</button></div></form>
  </section>
</div>
