<div class="fixed inset-0 z-50 grid place-items-center bg-slate-950/45 p-4" @click.self="$el.remove()">
  <section role="dialog" aria-modal="true" class="w-full max-w-sm rounded-2xl bg-white p-5 shadow-2xl">
    <p class="eyebrow">ROOM {{ room.number }}</p><h2 class="mt-1 text-xl font-bold text-slate-900">Edit room details</h2>
    {% if error %}<div role="alert" class="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-semibold text-red-700">{{ error }}</div>{% endif %}
    <form hx-post="/rooms/{{ room.id }}/details" hx-target="#modal-root" hx-swap="innerHTML" class="mt-4 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block"><span class="field-label">Room type</span><select required name="room_type_id" class="form-input">
        {% for type in room_types %}<option value="{{ type.id }}" {% if (room_type_id|default(room.room_type_item_id|string)) == (type.id|string) %}selected{% endif %}>{{ type.name }} · {{ money(type.rate) }} / night</option>{% endfor %}
      </select></label>
      <label class="block"><span class="field-label">Floor</span><input required maxlength="30" name="floor" value="{{ floor_val|default(room.floor) }}" class="form-input"></label>
      {% if room.nightly_rate_override %}<p class="rounded-lg bg-amber-50 p-2 text-xs text-amber-800">This room has a custom rate override. Changing its type will keep that rate.</p>{% endif %}
      <div class="flex justify-end gap-2"><button type="button" class="btn-secondary" @click="$el.closest('[role=dialog]').parentElement.remove()">Cancel</button><button class="btn-primary">Save room</button></div>
    </form>
  </section>
</div>
