<div class="fixed inset-0 z-50 grid place-items-center bg-slate-950/45 p-4" @click.self="$el.remove()">
  <section role="dialog" aria-modal="true" class="w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl">
    <p class="eyebrow">ROOM {{ room.number }}</p>
    <h2 class="mt-1 text-xl font-bold text-slate-900">Add folio charge</h2>
    <p class="mt-1 text-sm text-slate-500">{{ stay.guest_name or (stay.guest.name if stay.guest else 'Guest') }}</p>
    {% if error %}<div role="alert" class="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-semibold text-red-700">{{ error }}</div>{% endif %}
    <form hx-post="/rooms/{{ room.id }}/charge" hx-target="#modal-root" hx-swap="innerHTML" class="mt-4 space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block"><span class="field-label">Description</span><input required maxlength="240" name="description" value="{{ description_val if description_val is defined else '' }}" class="form-input" placeholder="Laundry, meal, extra bed…"></label>
      <div class="grid grid-cols-3 gap-3">
        <label><span class="field-label">Category</span><select name="category" class="form-input">{% for category in ('food','beverage','laundry','room','service') %}<option value="{{ category }}" {% if selected_category|default('service') == category %}selected{% endif %}>{{ category|title }}</option>{% endfor %}</select></label>
        <label><span class="field-label">Quantity</span><input required type="number" min=".01" step=".01" name="quantity" value="{{ quantity_val|default('1') }}" class="form-input"></label>
        <label><span class="field-label">Rate</span><input required type="number" min=".01" step=".01" name="unit_price" value="{{ rate_val|default('') }}" class="form-input"></label>
      </div>
      <div class="flex justify-end gap-2"><button type="button" class="btn-secondary" @click="$el.closest('[role=dialog]').parentElement.remove()">Cancel</button><button class="btn-primary">Add charge</button></div>
    </form>
  </section>
</div>
