<div class="panel">
  <div class="panel-heading mb-2">
    <div class="flex items-center gap-3">
      <span class="room-icon-chip" style="width:2.5rem;height:2.5rem;font-size:1.2rem;background:rgba(58,124,58,.14);color:#2E7D3E;"><i class="ph ph-notepad"></i></span>
      <div>
        <h2 class="panel-title"><i class="ph ph-notepad" style="font-size:1.05rem;margin-right:.45rem;vertical-align:-.18em;color:#8A6A14;"></i>Kitchen Order Ticket</h2>
        <p class="panel-subtitle">Arati Hotel · Khandbari, Sankhuwasabha</p>
      </div>
    </div>
  </div>

  <form method="post" action="/kots/{{ kot.id }}/items" class="grid gap-4 py-4">
    <div class="grid grid-cols-2 gap-2">
      <label class="block"><span class="field-label"><i class="ph ph-textbox"></i>Particular</span><input class="form-input" name="particular" type="text" placeholder="e.g. Thali, Momos..." required maxlength="160"></label>
      <label class="block"><span class="field-label"><i class="ph ph-numbox"></i>Qty</span><input class="form-input w-24" type="number" name="qty" min="1" step="1" value="1" required></label>
      <label class="block"><span class="field-label"><i class="ph ph-currency-inr"></i>Rate</span><input class="form-input w-24" type="number" name="rate" min="0" step="0.01" required></label>
    </div>
    <div class="flex items-end gap-2">
      <button type="submit" class="btn-primary flex-1">Add Item</button>
      <span x-text="items|length ? 'item'+(items|length>1?'s':'') : 'No items yet'" class="text-sm text-slate-500"></span>
    </div>
  </form>

  {% if items|length > 0 %}
  <div class="mt-4 p-3 bg-slate-50 rounded" style="min-height: 80px;">
    <p class="text-sm font-medium text-slate-800">Items:</p>
    {% raw %}
    <template x-for="(item, index) in items" :key="index">
      <div class="flex items-center gap-2 text-xs text-slate-600">
        <span x-text="item.particular || 'Item'"></span>
        <span x-text="item.qty"></span> × <span x-text="item.rate"> </span> = <span x-text="item.amount"> </span>
        <button type="button" @click="kot.items.splice(index, 1);" class="text-red-500 hover:underline cursor-pointer remove-item">Remove</button>
      </div>
      <hr class="my-1 border-slate-200">
    </template>
    {% endraw %}
  </div>
  {% endif %}

  {% if kot.status == "saved" %}
  <div class="mt-3 p-3 bg-amber-50 rounded text-sm">
    <p class="text-amber-800">KOT saved successfully!</p>
  </div>
  {% endif %}
</div>
</div>
