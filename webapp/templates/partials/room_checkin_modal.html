<div class="fixed inset-0 z-50 grid place-items-center bg-slate-950/45 p-4" @click.self="$el.remove()">
  <section role="dialog" aria-modal="true" class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
    <div class="mb-4 flex items-start justify-between">
      <div><p class="eyebrow">ROOM {{ room.number }}</p><h2 class="mt-1 text-xl font-bold text-slate-900">Check in guest</h2><p class="mt-1 text-sm text-slate-500">{{ room.type }} · {{ money(room.nightly_rate) }} per night</p></div>
      <button type="button" @click="$el.closest('[role=dialog]').parentElement.remove()" class="text-xl text-slate-400" aria-label="Close">×</button>
    </div>
    {% if error %}<div role="alert" class="mb-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-semibold text-red-700">{{ error }}</div>{% endif %}
    {% if reservation and reservation.deposit > 0 %}<p class="mb-3 rounded-lg bg-teal-50 p-2 text-xs text-teal-800">Reservation deposit recorded: {{ money(reservation.deposit) }}</p>{% endif %}
    <form hx-post="/rooms/{{ room.id }}/checkin" hx-target="#modal-root" hx-swap="innerHTML" class="space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block"><span class="field-label">Select existing guest</span><select name="guest_id" class="form-input"><option value="">Walk-in / new guest</option>
        {% for guest in guests %}<option value="{{ guest.id }}" {% if (selected_guest_id and selected_guest_id == (guest.id|string)) or (not selected_guest_id and reservation and reservation.guest_id == guest.id) %}selected{% endif %}>{{ guest.name }}{% if guest.phone %} · {{ guest.phone }}{% endif %}</option>{% endfor %}
      </select></label>
      <div class="grid gap-3 sm:grid-cols-2">
        <label><span class="field-label">Guest name (for walk-in)</span><input name="guest_name" maxlength="160" class="form-input" value="{{ guest_name_val|default('') }}" placeholder="Guest name"></label>
        <label><span class="field-label">Phone</span><input name="phone" maxlength="40" class="form-input" value="{{ phone_val|default('') }}" placeholder="98XXXXXXXX"></label>
        <label><span class="field-label">Email</span><input name="email" type="email" maxlength="180" class="form-input" value="{{ email_val|default('') }}" placeholder="guest@example.com"></label>
        <label class="sm:col-span-2"><span class="field-label">Address</span><input name="address" maxlength="240" class="form-input" value="{{ address_val|default('') }}" placeholder="Guest address"></label>
        <label><span class="field-label">Check-in</span><input required type="datetime-local" name="check_in" value="{{ now_local }}" class="form-input"></label>
        <label><span class="field-label">Check-out <span class="text-slate-400">(optional)</span></span><input type="datetime-local" name="check_out" value="{{ checkout_local }}" class="form-input"></label>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
        <button type="button" class="btn-secondary" @click="$el.closest('[role=dialog]').parentElement.remove()">Cancel</button>
        <button class="btn-primary">Confirm Check-in</button>
      </div>
    </form>
  </section>
</div>
