<div class="grid grid-cols-2 gap-4 sm:grid-cols-3 xl:grid-cols-5">
  {% for key,label,color in [('available','Available','#7D9B7A'),('occupied','Occupied','#1B3A2A'),('dirty','Needs cleaning','#B04A4A'),('reserved','Reserved','#2A4F3A'),('maintenance','Maintenance','#5A6B58')] %}
  <article class="room-summary" style="border-top-color:{{ color }}"><div class="room-summary-label">{{ label }}</div><div class="mt-2 flex items-end justify-between"><span class="room-summary-number">{{ room_counts[key] }}</span><span class="mb-1 text-xs font-semibold text-slate-500">{{ room_percentages[key] }}%</span></div></article>
  {% endfor %}
</div>
