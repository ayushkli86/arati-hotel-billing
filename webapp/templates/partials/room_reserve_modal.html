<div class="fixed inset-0 z-50 grid place-items-center bg-slate-950/45 p-4" @click.self="$el.remove()">
  <section role="dialog" aria-modal="true" class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
    <p class="eyebrow">ROOM {{ room.number }}</p>
    <h2 class="mt-1 text-xl font-bold text-slate-900">Reserve room</h2>
    <p class="mt-1 text-sm text-slate-500">{{ room.type }} · {{ money(room.nightly_rate) }} per night</p>
    {% if error %}<div role="alert" class="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-semibold text-red-700">{{ error }}</div>{% endif %}

    <form hx-post="/rooms/{{ room.id }}/reserve" hx-target="#modal-root" hx-swap="innerHTML" class="mt-4 space-y-4" x-data="{fillGuest(event){const guest=event.target.selectedOptions[0];this.$refs.name.value=guest.dataset.name||'';this.$refs.phone.value=guest.dataset.phone||'';this.$refs.email.value=guest.dataset.email||'';this.$refs.address.value=guest.dataset.address||''}}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block">
        <span class="field-label">Select existing guest</span>
        <select name="guest_id" class="form-input" @change="fillGuest($event)">
          <option value="">New guest</option>
          {% for guest in guests %}
          <option value="{{ guest.id }}" data-name="{{ guest.name }}" data-phone="{{ guest.phone }}" data-email="{{ guest.email }}" data-address="{{ guest.address }}" {% if selected_guest_id|default('') == (guest.id|string) %}selected{% endif %}>{{ guest.name }}{% if guest.phone %} · {{ guest.phone }}{% endif %}</option>
          {% endfor %}
        </select>
      </label>
      <div class="grid gap-x-4 gap-y-5 sm:grid-cols-2">
        <label><span class="field-label">Guest name</span><input x-ref="name" name="guest_name" maxlength="160" value="{{ guest_name_val|default('') }}" class="form-input" placeholder="Name for a new guest"></label>
        <label><span class="field-label">Phone</span><input x-ref="phone" name="phone" maxlength="40" value="{{ phone_val|default('') }}" class="form-input" placeholder="98XXXXXXXX"></label>
        <label><span class="field-label">Email</span><input x-ref="email" name="email" type="email" maxlength="180" value="{{ email_val|default('') }}" class="form-input" placeholder="guest@example.com"></label>
        <label class="sm:col-span-2"><span class="field-label">Address</span><input x-ref="address" name="address" maxlength="240" value="{{ address_val|default('') }}" class="form-input" placeholder="Guest address"></label>
        <label><span class="field-label">Expected check-in</span><input required type="datetime-local" name="check_in" value="{{ checkin_local }}" class="form-input"></label>
        <label><span class="field-label">Expected check-out</span><input required type="datetime-local" name="check_out" value="{{ checkout_local }}" class="form-input"></label>
        <label><span class="field-label">Nightly rate (NPR)</span><input type="number" min="0" max="9999999999.99" step=".01" name="nightly_rate" value="{{ rate_val|default(room.nightly_rate) }}" class="form-input"></label>
        <label><span class="field-label">Deposit (NPR)</span><input type="number" min="0" max="9999999999.99" step=".01" name="deposit" value="{{ deposit_val|default('0') }}" class="form-input"></label>
        <label class="sm:col-span-2"><span class="field-label">Reservation notes</span><textarea name="notes" maxlength="1000" rows="2" class="form-input">{{ notes_val|default('') }}</textarea></label>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
        <button type="button" class="btn-secondary" @click="$el.closest('[role=dialog]').parentElement.remove()">Cancel</button>
        <button class="btn-primary">Confirm Reservation</button>
      </div>
    </form>
  </section>
</div>
