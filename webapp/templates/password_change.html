{% extends "base.html" %}
{% set active_page='password' %}
{% block title %}Update password{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <div class="mb-5"><p class="eyebrow">ACCOUNT SECURITY</p><h1 class="page-title">Set a new password</h1><p class="page-subtitle">A password update is required before you can continue to the hotel workspace.</p></div>
  {% if error %}<div role="alert" class="mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm font-semibold text-red-800">{{ error }}</div>{% endif %}
  <section class="panel">
    <form method="post" action="/password/change" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block text-sm font-medium">New password
        <input class="form-input mt-1" type="password" name="new_password" minlength="12" autocomplete="new-password" required>
        <span class="mt-1 block text-xs text-slate-500">Use at least 12 characters.</span>
      </label>
      <label class="block text-sm font-medium">Confirm new password
        <input class="form-input mt-1" type="password" name="confirm_password" minlength="12" autocomplete="new-password" required>
      </label>
      <button class="btn-primary">Save password</button>
    </form>
  </section>
</div>
{% endblock %}
